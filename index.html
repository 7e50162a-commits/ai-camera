<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <!-- 確保手機瀏覽器能正確縮放畫面 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

    <style>
        body {
            margin: 0;
            background: black;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        video {
            width: 100vw;
            height: auto;
            /* 讓視訊畫面在還沒載入前不要顯示多餘的白色底塊 */
            background: black; 
        }

        #result {
            font-size: 35px;
            padding: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>AI Camera</h1>

    <div id="result">
        Starting...
    </div>

    <video id="webcam" autoplay playsinline muted></video>

    <script>
        // 請確保你的 Teachable Machine 模型網址最後有加上斜線 "/"
        const URL = "https://teachablemachine.withgoogle.com/models/6T5mxKzzf/";

        let model;
        let video;

        async function init() {
            try {
                document.getElementById("result").innerHTML = "Initializing AI & Camera...";
                video = document.getElementById("webcam");

                // 【效能優化】使用 Promise.all 讓「模型下載」與「開起相機」同時進行，大幅縮短等待時間
                const [loadedModel, stream] = await Promise.all([
                    // 1. 同步載入模型
                    tmImage.load(URL + "model.json", URL + "metadata.json"),

                    // 2. 同步請求相機權限與串流
                    navigator.mediaDevices.getUserMedia({
                        video: {
                            // 將 exact 改為理想值描述，避免瀏覽器因硬體名稱不符而卡住或報錯
                            facingMode: "environment"
                        },
                        audio: false
                    })
                ]);

                // 將載入好的模型與串流賦值
                model = loadedModel;
                video.srcObject = stream;

                // 【穩定性優化】確保影片的元數據（如解析度）載入完成後再播放，防止畫面阻塞
                video.onloadedmetadata = async () => {
                    try {
                        await video.play();
                        document.getElementById("result").innerHTML = "AI Camera Ready";
                        // 開始預測迴圈
                        window.requestAnimationFrame(loop);
                    } catch (playError) {
                        document.getElementById("result").innerHTML = "Playback Error: " + playError;
                        console.error(playError);
                    }
                };

            } catch (e) {
                document.getElementById("result").innerHTML = "ERROR:<br><br>" + e;
                console.error(e);
            }
        }

        async function loop() {
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            // 確保影片已經準備好且有畫面寬高，才進行預測，避免產生空數據報錯
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                const prediction = await model.predict(video);
                
                let highest = prediction[0];

                for (let i = 1; i < prediction.length; i++) {
                    if (prediction[i].probability > highest.probability) {
                        highest = prediction[i];
                    }
                }

                let result = highest.className + " " + (highest.probability * 100).toFixed(1) + "%";

                document.getElementById("result").innerHTML = result;

                if (window.AppInventor) {
                    window.AppInventor.setWebViewString(result);
                }
            }
        }

        // 啟動程式
        init();
    </script>

</body>

</html>
