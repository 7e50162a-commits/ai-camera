<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image"></script>

  <style>

    body{
      background:black;
      color:white;
      text-align:center;
      font-family:Arial;
      margin:0;
    }

    canvas{
      width:100vw !important;
      height:auto !important;
    }

    #result{
      font-size:40px;
      padding:20px;
    }

  </style>

</head>

<body>

<h1>AI Camera</h1>

<div id="result">
Loading...
</div>

<div id="webcam-container"></div>

<script>

const URL =
"https://teachablemachine.withgoogle.com/models/sshA3Fu2x/";

let model;
let webcam;

async function init() {

  model = await tmImage.load(
    URL + "model.json",
    URL + "metadata.json"
  );

  webcam = new tmImage.Webcam(
    400,
    400,
    false
  );

  await webcam.setup();

  await webcam.play();

  document.getElementById(
    "webcam-container"
  ).appendChild(webcam.canvas);

  window.requestAnimationFrame(loop);
}

async function loop() {

  webcam.update();

  await predict();

  window.requestAnimationFrame(loop);
}

async function predict() {

  const prediction =
    await model.predict(webcam.canvas);

  let highest = prediction[0];

  for(let i=1;i<prediction.length;i++){

    if(
      prediction[i].probability >
      highest.probability
    ){
      highest = prediction[i];
    }
  }

  let result =
    highest.className +
    " " +
    (highest.probability * 100)
    .toFixed(1) +
    "%";

  document.getElementById(
    "result"
  ).innerHTML = result;

  if(window.AppInventor){

    window.AppInventor
      .setWebViewString(result);
  }
}

init();

</script>

</body>
</html>
