<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

<style>

body{
    margin:0;
    background:black;
    color:white;
    text-align:center;
    font-family:Arial;
}

video{
    width:100vw;
    height:auto;
}

#result{
    font-size:35px;
    padding:20px;
}

</style>

</head>

<body>

<h1>AI Camera</h1>

<div id="result">
Starting...
</div>

<video
id="webcam"
autoplay
playsinline
muted
></video>

<script>

const URL =
"https://teachablemachine.withgoogle.com/models/qqJUvhzWf/";

let model;
let video;

async function init(){

try{

document.getElementById("result")
.innerHTML = "Loading Model...";

model = await tmImage.load(
    URL + "model.json",
    URL + "metadata.json"
);

document.getElementById("result")
.innerHTML = "Opening Back Camera...";

video =
document.getElementById("webcam");

const stream =
await navigator.mediaDevices.getUserMedia({

video:{

facingMode:{
exact:"environment"
}

},

audio:false

});

video.srcObject = stream;

await video.play();

document.getElementById("result")
.innerHTML = "Camera Success";

window.requestAnimationFrame(loop);

}catch(e){

document.getElementById("result")
.innerHTML =
"ERROR:<br><br>" + e;

console.error(e);

}

}

async function loop(){

await predict();

window.requestAnimationFrame(loop);

}

async function predict(){

const prediction =
await model.predict(video);

let highest = prediction[0];

for(let i=1;i<prediction.length;i++){

if(
prediction[i].probability >
highest.probability
){
highest = prediction[i];
}

}

let result =
highest.className +
" " +
(highest.probability * 100)
.toFixed(1) +
"%";

document.getElementById("result")
.innerHTML = result;

if(window.AppInventor){

window.AppInventor
.setWebViewString(result);

}

}

init();

</script>

</body>

</html>
